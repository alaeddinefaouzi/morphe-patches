name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Release Morphe Patches
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build Patches with Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon
          find patches/build/libs -name "*.mpp" -exec cp {} patches-1.0.0.mpp \;

      - name: Generate Patches List
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ./gradlew generatePatchesList --no-daemon || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Morphe Game Patches ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            patches-1.0.0.mpp
            patches/build/libs/*.mpp
            patches-bundle.json
            patches-list.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

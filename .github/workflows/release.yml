name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Release Morphe Patches
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build Patches with Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          chmod +x gradlew
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION from tag $GITHUB_REF_NAME"
          ./gradlew :patches:buildAndroid -Pversion="$VERSION" --no-daemon
          echo "=== Content of patches/build/libs ==="
          ls -la patches/build/libs/ || true
          find patches/build/libs/ -name "*.mpp" -not -name "*-sources.mpp" -not -name "*-javadoc.mpp" -exec cp {} "patches-${VERSION}.mpp" \; || true
          ls -la patches-${VERSION}.mpp || true

      - name: Generate Patches List
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew generatePatchesList -Pversion="$VERSION" --no-daemon || true

      - name: Generate patches-bundle.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%S")
          cat <<EOF > patches-bundle.json
          {
            "version": "$VERSION",
            "created_at": "$NOW",
            "description": "@alaeddinefaouzi - Curated patches for Android apps and games",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/patches-${VERSION}.mpp"
          }
          EOF
          echo "Generated patches-bundle.json:"
          cat patches-bundle.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "@alaeddinefaouzi Patches ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            patches-*.mpp
            patches/build/libs/*.mpp
            patches-bundle.json
            patches-bundle.png
            patches-list.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
